services:
  postgres:
    image: postgres:16-alpine
    container_name: hello-minto-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: hello_minto
      POSTGRES_USER: hello_minto_dev
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hello_minto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_minto_dev -d hello_minto"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hello_minto_postgres_data:
